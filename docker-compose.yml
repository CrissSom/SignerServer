# Builds the image from this repository.
#
# Use this file for local development and for Portainer stacks deployed from a
# Git repository (Portainer builds the image itself in that mode).
# To deploy from Portainer's web editor instead — where there is no build
# context — use portainer-stack.yml, which pulls a pre-built image.
#
# Values come from a .env file sitting next to this file (locally) or from the
# stack's environment-variable panel (in Portainer). See .env.example.

services:
  signer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/crisssom/signerserver}:${IMAGE_TAG:-latest}
      # NOTE: Portainer's own container is named `portainer` in its documented
      # install. If this host runs Portainer itself, Docker will refuse to
      # create a second container with that name and the stack deploy fails
      # with a name conflict — set CONTAINER_NAME to something else there.
    container_name: ${CONTAINER_NAME:-portainer}
    restart: unless-stopped

    ports:
      # Published on all interfaces by default. Set BIND_ADDRESS=127.0.0.1 when a
      # reverse proxy on this host terminates TLS, so the plain-HTTP port is not
      # reachable from the LAN.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"

    environment:
      # ── Azure Key Vault (required) ──────────────────────────────────────────
      KEY_VAULT_URL: ${KEY_VAULT_URL:?KEY_VAULT_URL is required — set it in .env or the Portainer stack env vars}
      CERTIFICATE_NAME: ${CERTIFICATE_NAME:?CERTIFICATE_NAME is required — set it in .env or the Portainer stack env vars}

      # ── Azure authentication ────────────────────────────────────────────────
      # Service principal. Leave all three empty to fall back to a managed identity.
      TENANT_ID: ${TENANT_ID:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}

      # ── API security ────────────────────────────────────────────────────────
      # Clients must send this as the X-API-Key header. Empty disables auth.
      API_KEY: ${API_KEY:-}

      # ── Signing defaults ────────────────────────────────────────────────────
      DEFAULT_TIMESTAMP_URL: ${DEFAULT_TIMESTAMP_URL:-http://timestamp.digicert.com}
      DEFAULT_DIGEST: ${DEFAULT_DIGEST:-SHA-256}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}

      # ── Server runtime ──────────────────────────────────────────────────────
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # Upload/signing scratch space. Kept off the container's writable layer so
      # large binaries do not inflate it. Contents are disposable.
      - signer-tmp:/data/tmp

    tmpfs:
      # Java scribbles hsperfdata here; small and RAM-backed on purpose.
      - /tmp:size=64m

    security_opt:
      - no-new-privileges:true

    # Docker's built-in init: reaps stray jsign/osslsigncode children.
    init: true

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1g}

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  signer-tmp:
