services:
  signer:
    build: .
    image: signer-server:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    # Limit container resources
    deploy:
      resources:
        limits:
          memory: 512M
    # Health-check using the /health endpoint
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # Optional: mount a directory to serve as the temp workspace
      - /tmp/signer:/tmp
