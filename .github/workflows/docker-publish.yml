name: Build and publish container image

# Publishes to GHCR so Portainer can pull a ready-made image instead of
# building from source. See portainer-stack.yml.
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GHCR rejects uppercase image names; this repo's owner has capitals.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped for pull requests: they build only, they never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Only meaningful for a single-arch load; runs on the runner's amd64.
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t signer:ci .
          docker run -d --name signer-ci \
            -e KEY_VAULT_URL=https://example.vault.azure.net/ \
            -e CERTIFICATE_NAME=ci-cert \
            -p 8080:8080 signer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "health OK"; curl -sS http://127.0.0.1:8080/health; exit 0
            fi
            sleep 2
          done
          echo "health check never passed"; docker logs signer-ci; exit 1
