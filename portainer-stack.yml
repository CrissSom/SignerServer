# Portainer stack — pulls a pre-built image, no build context required.
#
# Deploy: Portainer → Stacks → Add stack → Web editor → paste this file,
# then fill in the variables below under "Environment variables".
#
# Required:  KEY_VAULT_URL, CERTIFICATE_NAME
# Strongly recommended:  API_KEY, and TENANT_ID / CLIENT_ID / CLIENT_SECRET
#                        (omit the three Azure credentials to use a managed identity)
#
# Everything else has a working default. Full reference: .env.example

services:
  signer:
    image: ${IMAGE_NAME:-ghcr.io/crisssom/signerserver}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-signer-server}
    restart: unless-stopped

    ports:
      # Published on all interfaces by default. Set BIND_ADDRESS=127.0.0.1 when a
      # reverse proxy on this host terminates TLS, so the plain-HTTP port is not
      # reachable from the LAN.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"

    environment:
      # ── Azure Key Vault (required) ──────────────────────────────────────────
      KEY_VAULT_URL: ${KEY_VAULT_URL:?set KEY_VAULT_URL in the stack environment variables}
      CERTIFICATE_NAME: ${CERTIFICATE_NAME:?set CERTIFICATE_NAME in the stack environment variables}

      # ── Azure authentication (leave empty to use a managed identity) ────────
      TENANT_ID: ${TENANT_ID:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}

      # ── API security — sent by clients as the X-API-Key header ──────────────
      API_KEY: ${API_KEY:-}

      # ── Signing defaults ────────────────────────────────────────────────────
      DEFAULT_TIMESTAMP_URL: ${DEFAULT_TIMESTAMP_URL:-http://timestamp.digicert.com}
      DEFAULT_DIGEST: ${DEFAULT_DIGEST:-SHA-256}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}

      # ── Server runtime ──────────────────────────────────────────────────────
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - signer-tmp:/data/tmp

    tmpfs:
      - /tmp:size=64m

    security_opt:
      - no-new-privileges:true

    # Docker's built-in init: reaps stray jsign/osslsigncode children.
    init: true

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1g}

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  signer-tmp:
